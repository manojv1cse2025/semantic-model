services:

  postgres:
    image: pgvector/pgvector:pg17

    environment:
      POSTGRES_DB: semanticdb
      POSTGRES_USER: semantic
      POSTGRES_PASSWORD: semantic_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U semantic -d semanticdb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
